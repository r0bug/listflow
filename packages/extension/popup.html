<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>listflow</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        width: 340px;
        margin: 0;
        padding: 0;
        color: #eee;
        background: #181818;
      }
      header { padding: 12px 14px 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
      header h1 { font-size: 15px; margin: 0; }
      .sublink { color: #6af; font-size: 11px; text-decoration: none; }
      .sublink:hover { text-decoration: underline; }
      #scan-section { padding: 8px 14px; border-top: 1px solid #2a2a2a; }
      .scan-row { display: flex; align-items: center; gap: 8px; }
      .scan-row button { background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; border-radius: 3px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
      .scan-row button:hover { background: #333; border-color: #555; }
      .scan-row button:disabled { opacity: 0.5; cursor: not-allowed; }
      .folder { font-size: 11px; color: #888; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .progress-wrap { margin-top: 6px; display: none; }
      .progress-wrap.visible { display: block; }
      .progress-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
      .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4a8, #6af); transition: width 0.3s ease; }
      .progress-text { font-size: 11px; color: #aaa; margin-top: 4px; }
      .progress-text .err { color: #f66; }
      .progress-text .ok { color: #6c6; }
      .status { font-size: 12px; }
      .status.ok { color: #6c6; }
      .status.err { color: #f66; }
      .status.warn { color: #ea4; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
      .dot.ok { background: #6c6; }
      .dot.err { background: #f66; }
      .dot.warn { background: #ea4; }
      nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 0 10px 8px; }
      nav button {
        background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a;
        border-radius: 4px; padding: 6px 4px; font-size: 11px; cursor: pointer;
      }
      nav button:hover { background: #333; border-color: #555; }
      section { border-top: 1px solid #2a2a2a; padding: 10px 14px; }
      section h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #999; margin: 0 0 6px; }
      .row { padding: 6px 0; border-top: 1px dashed #2a2a2a; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .row:first-child { border-top: 0; }
      .row .t { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row button { background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 3px 8px; cursor: pointer; font-size: 11px; white-space: nowrap; }
      .row button:hover { background: #333; }
      .empty { color: #666; font-style: italic; font-size: 12px; padding: 6px 0; }
      form.panel label { display: block; font-size: 11px; color: #aaa; margin-top: 8px; }
      form.panel input, form.panel select { width: 100%; padding: 5px 7px; box-sizing: border-box; background: #222; color: #eee; border: 1px solid #3a3a3a; border-radius: 3px; margin-top: 3px; font-size: 12px; }
      form.panel .actions { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
      form.panel button[type=submit] { background: #4a8; color: #111; border: 0; border-radius: 3px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
      form.panel button.ghost { background: transparent; color: #999; border: 0; padding: 4px 6px; font-size: 11px; cursor: pointer; text-decoration: underline; }
      form.panel .msg { font-size: 11px; margin-left: auto; }
      .status-col { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
      .mcp-badge { font-size: 10px; color: #ea4; background: #2a2a12; border: 1px solid #554818; border-radius: 10px; padding: 1px 6px; display: none; }
      .mcp-badge.visible { display: inline-block; }
      .userline { font-size: 11px; color: #9c9; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
      .userline .acct { color: #6af; }
      .userline button { background: none; border: 0; color: #999; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0; }
      .hidden { display: none !important; }
      form.config-extra { display: none; }
      form.config-extra.visible { display: block; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>listflow</h1>
        <a href="#" id="open-webui" class="sublink">Open app →</a>
      </div>
      <div class="status-col">
        <span id="status" class="status"><span class="dot"></span><span id="status-text">Checking…</span></span>
        <span id="mcp-badge" class="mcp-badge" title="Batches awaiting external AI"></span>
      </div>
    </header>

    <!-- Login (TeamTime credentials via server proxy) -->
    <section id="login-section" class="hidden">
      <h2>Sign in</h2>
      <form class="panel" id="login-form">
        <label>Email
          <input id="login-email" type="email" autocomplete="username" placeholder="you@yakimafinds.com" />
        </label>
        <label>PIN
          <input id="login-pin" type="password" autocomplete="current-password" placeholder="TeamTime PIN" />
        </label>
        <div class="actions">
          <button type="submit">Sign in</button>
          <span id="login-msg" class="msg"></span>
        </div>
      </form>
    </section>

    <!-- Signed-in bar: who + which eBay account this Chrome profile is pinned to -->
    <section id="session-section" class="hidden">
      <div class="userline">
        <span id="user-name"></span>
        <span>eBay: <select id="pinned-account" style="background:#222;color:#6af;border:1px solid #3a3a3a;border-radius:3px;font-size:11px;padding:2px 4px;"></select></span>
        <button id="logout-btn" type="button">sign out</button>
      </div>
    </section>

    <nav id="nav" class="hidden">
      <button data-path="/">Items</button>
      <button data-path="/pool">Pool</button>
      <button data-path="/drafts">Drafts</button>
      <button data-path="/devices">Devices</button>
      <button data-path="/settings">Settings</button>
      <button id="toggle-config">Config</button>
    </nav>

    <section id="scan-section" class="hidden">
      <div class="scan-row">
        <button id="scan-btn">Scan inbox</button>
        <span id="scan-folder" class="folder" title=""></span>
      </div>
      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text"></div>
      </div>
    </section>

    <section id="config-section">
      <form class="panel config-extra" id="config">
        <label>API base URL
          <input id="baseUrl" placeholder="http://localhost:3005" />
        </label>
        <label>Web app URL
          <input id="webUrl" placeholder="http://localhost:5173" />
        </label>
        <label>Vision provider
          <select id="aiProvider">
            <option value="anthropic">Anthropic API (per-token billing)</option>
            <option value="external-mcp">External MCP (Claude Max / Code)</option>
            <option value="mock">Mock (no AI)</option>
          </select>
        </label>
        <div class="actions">
          <button type="submit">Save &amp; test</button>
          <span id="config-msg" class="msg"></span>
        </div>
      </form>
    </section>

    <section id="needs-comps-section" class="hidden">
      <h2>Items needing sold comps</h2>
      <div id="needs-comps" class="empty">…</div>
    </section>

    <script src="lib/api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
