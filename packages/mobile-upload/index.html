<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#181818" />
  <title>listflow upload</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; background: #181818; color: #eee; margin: 0; padding: 16px; padding-bottom: 90px; }
    h1 { font-size: 18px; margin: 4px 0 16px; }
    h1 small { color: #6af; font-weight: 400; font-size: 12px; margin-left: 8px; }
    label { display: block; font-size: 13px; color: #aaa; margin: 12px 0 4px; }
    input, button { font-size: 16px; border-radius: 8px; }
    input { width: 100%; padding: 12px; background: #222; color: #eee; border: 1px solid #3a3a3a; }
    button { padding: 12px 18px; border: 0; cursor: pointer; }
    .primary { background: #4a8; color: #111; font-weight: 600; width: 100%; margin-top: 16px; }
    .ghost { background: #2a2a2a; color: #eee; border: 1px solid #3a3a3a; }
    .hidden { display: none !important; }
    #user-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #9c9; margin-bottom: 12px; }
    #user-bar button { font-size: 12px; padding: 6px 10px; }
    .msg { font-size: 13px; margin-top: 10px; min-height: 18px; }
    .msg.err { color: #f66; }
    .msg.ok { color: #6c6; }
    /* capture area */
    #drop { border: 2px dashed #3a3a3a; border-radius: 12px; padding: 28px 16px; text-align: center; color: #888; margin-top: 8px; }
    #drop.active { border-color: #4a8; color: #4a8; }
    .item-tag-row { display: flex; gap: 8px; align-items: flex-end; }
    .item-tag-row > div { flex: 1; }
    #next-item { white-space: nowrap; height: 46px; }
    /* queue */
    #queue { margin-top: 16px; }
    .qrow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #262626; font-size: 13px; }
    .qrow img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #222; }
    .qrow .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; }
    .qrow .state { font-size: 12px; }
    .state.pending { color: #ea4; } .state.done { color: #6c6; } .state.dup { color: #6af; } .state.fail { color: #f66; }
    .qrow button { font-size: 11px; padding: 4px 8px; }
    #bigbar { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #181818ee; border-top: 1px solid #2a2a2a; backdrop-filter: blur(6px); }
    #bigbar button { width: 100%; font-size: 18px; padding: 14px; }
  </style>
</head>
<body>
  <h1>listflow <small>photo upload</small></h1>

  <!-- Login -->
  <div id="login-view">
    <label>Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@yakimafinds.com" />
    <label>PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="TeamTime PIN" />
    <button class="primary" id="login-btn">Sign in</button>
    <div class="msg" id="login-msg"></div>
  </div>

  <!-- Capture -->
  <div id="main-view" class="hidden">
    <div id="user-bar">
      <span id="who"></span>
      <button class="ghost" id="logout-btn">sign out</button>
    </div>

    <div class="item-tag-row">
      <div>
        <label>Item tag <span style="color:#666">(groups photos into one item)</span></label>
        <input id="item-tag" placeholder="item-1" />
      </div>
      <button class="ghost" id="next-item">Next item →</button>
    </div>

    <div id="drop">
      Tap to shoot or pick photos
      <input id="file-input" type="file" accept="image/*" capture="environment" multiple class="hidden" />
    </div>
    <div class="msg" id="cap-msg"></div>

    <div id="queue"></div>

    <div id="bigbar" class="hidden">
      <button class="primary" id="upload-btn">Upload</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
